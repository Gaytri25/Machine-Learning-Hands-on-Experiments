name: Python Script Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Keeps your manual run button active

# Gives the runner permission to commit and push changes back to your repository
permissions:
  contents: write

jobs:
  run-and-save:
    runs-on: ubuntu-latest

    steps:
      # 1. Downloads your repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installs Python on the runner
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Change to your preferred Python version

      # 3. Installs external libraries if you have a requirements.txt file
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Executes your Python file
      - name: Run Python Script
        run: python main.py # Replace main.py with your exact script filename

      # 5. Automatically saves and pushes any newly generated files back to GitHub
      - name: Commit and Push Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stages all changes, model files, images, or logs created by the script
          git add .
          
          # Commits only if changes exist to avoid workflow errors
          git diff-index --quiet HEAD || (git commit -m "Automated update from runner" && git push)
